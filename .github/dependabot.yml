version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      vite-toolchain:
        patterns:
          - vite
          - "@vitejs/plugin-react"
          - electron-vite
    ignore:
      # electron-vite 5 only supports Vite through v7. Upgrade these together
      # once electron-vite declares Vite 8 compatibility.
      - dependency-name: vite
        versions: [">=8"]
      - dependency-name: "@vitejs/plugin-react"
        versions: [">=6"]
      # Keep ambient Node APIs aligned with the Node 22 runtime used by CI.
      - dependency-name: "@types/node"
        versions: [">=23"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
