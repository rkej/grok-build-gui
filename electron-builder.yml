appId: app.grok-build-gui.desktop
productName: Grok Build
copyright: Copyright 2026 Grok Build GUI contributors

directories:
  output: release
  buildResources: resources

files:
  - out/**/*
  - package.json

extraResources:
  - from: resources/icon.png
    to: icon.png

asar: true
asarUnpack:
  - node_modules/node-pty/**/*
# node-pty 1.1 ships N-API prebuilds for macOS and Windows; npm compiles the
# Linux host binary during install. Rebuilding makes cross-arch packaging fail.
npmRebuild: false
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.inherit.plist
  notarize: false
  darkModeSupport: true
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]

linux:
  category: Development
  executableName: grok-build-gui
  synopsis: Codex-style desktop client for the Grok Build harness
  description: A native desktop shell around grok agent stdio.
  target:
    - target: AppImage
      arch: [x64]

win:
  executableName: grok-build-gui
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380
